<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canvas 2.0 | Live Responses</title><style>*{box-sizing:border-box}body{background:#071827;color:#e9f7ff;font:16px Arial,sans-serif;margin:0;padding:28px}main{max-width:1300px;margin:auto}h1{font-size:40px;margin-bottom:8px}.tag{color:#57d9ed;text-transform:uppercase;letter-spacing:2px}.stat{font-size:34px;font-weight:700;color:#57d9ed}.row{display:grid;grid-template-columns:200px 1fr;gap:18px;padding:18px;background:#102d46;border:1px solid #2f526a;border-radius:12px;margin:12px 0}.name{font-weight:700}.question{color:#8ed6e5;margin:8px 0}.answer{line-height:1.6;white-space:pre-wrap}button{background:#57d9ed;color:#092338;padding:12px 17px;border:0;border-radius:8px;font-weight:700;cursor:pointer;margin:10px 10px 12px 0}input{padding:12px;border-radius:8px;border:1px solid #aaa;font:inherit}#status{color:#bbcedc}#rows{margin-top:14px}.waiting{color:#ffce81}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><main><div class="tag">Canvas 2.0 · Instructor Dashboard</div><h1>Live Faculty Responses</h1><div class="stat" id="counter">— / 12 submitted</div><p id="status">Connect to your Apps Script endpoint to load responses.</p><button id="reveal">Reveal Responses</button><button id="refresh">Refresh Now</button><div id="rows"></div></main><script>
const API_URL='https://script.google.com/macros/s/AKfycbxc7ULIHmD9JSDWPdggVm4h9D_1djf4h8SzHYlCM5G-4SUQljVrW4gwkt3FS-P2cxAyyQ/exec';const PARTICIPANTS=['Patty Adams','Todd Cassler','Leon Herb','Phil Lechner','Tom McDevitt','Brian Potteiger','Jeff Rettew','Bryan Sayre','Andrew Sedler','Tracey Semmel','Richie Tylka','Heather Yobb'];let revealed=false;let records=[];const el=id=>document.getElementById(id);
function render(){el('counter').textContent=`${records.length} / ${PARTICIPANTS.length} submitted`;el('rows').replaceChildren();for(const person of PARTICIPANTS){const r=records.find(x=>x.name===person);const row=document.createElement('article');row.className='row';const name=document.createElement('div');name.className='name';name.textContent=person;const content=document.createElement('div');if(!r){content.textContent='⏳ Awaiting response';content.className='waiting'}else if(!revealed){content.textContent='✓ Submitted — hidden until reveal'}else{const q=document.createElement('div');q.className='question';q.textContent=`Prompt ${r.promptId}: ${r.prompt}`;const a=document.createElement('div');a.className='answer';a.textContent=r.response;content.append(q,a)}row.append(name,content);el('rows').append(row)}}
async function load(){if(!API_URL.startsWith('https://')){el('status').textContent='Configure API_URL in dashboard.html to connect live submissions.';return}try{const res=await fetch(API_URL+'?action=list&v='+Date.now());const data=await res.json();if(!data.ok)throw Error(data.error||'Unable to load');records=data.records||[];el('status').textContent=`Updated ${new Date().toLocaleTimeString()} · Refreshes every 5 seconds`;render()}catch(e){el('status').textContent='Connection error: '+e.message}}el('reveal').onclick=()=>{revealed=!revealed;el('reveal').textContent=revealed?'Hide Responses':'Reveal Responses';render()};el('refresh').onclick=load;render();load();setInterval(load,5000);
</script></body></html>
